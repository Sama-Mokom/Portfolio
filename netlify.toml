# Netlify's OpenNext adapter is auto-configured for Next.js projects.
[build]
  command = "npm run build"
  publish = ".next"

[context.production.environment]
  NODE_ENV = "production"
  SITE_URL = "https://samomokom.netlify.app"

# Preview and branch builds intentionally omit SITE_URL so they emit noindex.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
